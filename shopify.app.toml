# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "79a36d8400b076734eb79911933f091e"
name = "ethosmerchant"
# Static URL for TOML validation only. While `pnpm dev` runs, the CLI must override this with your tunnel URL.
# Never leave the live app pointed at example.com — Admin embeds this URL in an iframe.
application_url = "https://ethos-merchant-shopify-production.up.railway.app"
embedded = true

[build]
# Keep false for the live app: `pnpm dev` must not overwrite Partner URLs with a dead trycloudflare tunnel.
# Local dev: use the CLI Preview URL (press `p`) or run `pnpm run deploy:shopify` after a dev session if you temporarily changed URLs.
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_products,read_inventory,read_locations"

[auth]
redirect_urls = [
  "https://ethos-merchant-shopify-production.up.railway.app/auth/callback",
  "https://ethos-merchant-shopify-production.up.railway.app/auth/shopify/callback",
]

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = [ "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/inventory_levels/update"
  topics = [ "inventory_levels/update" ]
